fail_fast: true
repos:
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]
        
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        
      - id: isort
        name: isort
        entry: isort
        language: system
        types: [python]

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest-check
        entry: pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

